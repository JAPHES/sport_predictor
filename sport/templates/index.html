<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportspredictor</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            color: #1f2933;
            background: #eef2f7;
        }

        main {
            width: min(720px, calc(100% - 32px));
            text-align: center;
        }

        h1 {
            margin: 0 0 24px;
            font-size: clamp(32px, 5vw, 56px);
            line-height: 1.1;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 0 20px;
            border-radius: 6px;
            color: #ffffff;
            background: #0f766e;
            font-weight: 700;
            text-decoration: none;
        }

        a:hover {
            background: #115e59;
        }
    </style>
</head>
<body>
<main>
    <h1>Sports Predictor</h1>
    <a href="{% url 'predictor' %}">Open predictor</a>
</main>
</body>
</html>
